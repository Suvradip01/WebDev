<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Login Page</title>
</head>

<body>
    <div>
        <!-- Header Section -->
        <header>
            <h1 style="text-align: center;">Welcome to Kitkat</h1>
            <hr>
        </header>

        <!-- Navigation Links -->
        <center>
            <nav>
                <a href="#">Home</a> |
                <a href="#">Features</a> |
                <a href="#">Contact</a>
            </nav>
        </center>


        <br><br>

        <!-- Centered Login Table -->
        <center>
            <table width="50%" border="1" cellspacing="1" cellpadding="10">
                <tr>
                    <th>Login</th>
                </tr>

                <tr>
                    <td align="center">
                        <input type="email" name="email" id="email" placeholder="Enter your email ID"><br><br>
                        <input type="password" name="password" id="password" placeholder="Enter password"><br><br>
                        <button>Sign In</button>
                        <button>Signup</button>
                        <br><br>
                        <!-- Added Links -->
                        <a href="#">Forgot Password?</a>
                    </td>
                </tr>
            </table>
        </center>
    </div>


</body>

</html>
